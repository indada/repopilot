name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, windows-2022, macos-15-intel, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npm prune --omit=dev
      - run: node scripts/package.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.os }}
          path: .cache/assets/*
          if-no-files-found: error
  image:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.agent
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/indada/repopilot-agent:1.8.0
          labels: org.opencontainers.image.source=https://github.com/indada/repopilot
  publish:
    needs: [package, image]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: package-*
          path: assets
          merge-multiple: true
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$GITHUB_REF_NAME" = "v$(node -p "require('./package.json').version")"
          cd assets
          sha256sum *.zip *.tar.gz > SHA256SUMS.txt
          cd ..
          gh release create "$GITHUB_REF_NAME" --verify-tag --draft --title "RepoPilot $GITHUB_REF_NAME" --notes-file docs/releases/1.8.0.md assets/*
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest
